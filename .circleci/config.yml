version: 2.1
workflows:
  version: 2
  test:
    jobs:
      - backend_tests
      - backend_checks
      - jasmine
      - frontend-checks
      - proxy_extension_tests
      - release-image:
          name: release-kerghan-base
          image: kerghan-base
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-kerghan-base-arm64
          image: kerghan-base
          arch: arm64
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-circleci_kerghan-base
          image: circleci_kerghan-base
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-circleci_kerghan-base-arm64
          image: circleci_kerghan-base
          arch: arm64
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-production_kerghan-base
          image: production_kerghan-base
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-production_kerghan-base-arm64
          image: production_kerghan-base
          arch: arm64
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-vite_kerghan-base
          image: vite_kerghan-base
          filters: { tags: { only: /.*/ } }
      - release-image:
          name: release-vite_kerghan-base-arm64
          image: vite_kerghan-base
          arch: arm64
          filters: { tags: { only: /.*/ } }
jobs:
  # Minimal bootstrap CI: backend, frontend and proxy-extension tests/lint only for now. The
  # full pipeline (release chain, image publishing) lives in .circleci/config.yml.bkp until the
  # rest of the stack and its required CircleCI secrets are actually in place — see aux/todo.md.
  #
  # No DB service container yet: no Sequelize models/specs exist to need one (see
  # docs/agents/product.md). Add a cimg/mysql:8.0 service alongside the first DB-touching spec.
  backend_tests:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: rm frontend -rf; cp backend/* ./ -r; rm backend -rf
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Tests
          command: npm run coverage

  backend_checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: rm frontend -rf; cp backend/* ./ -r; rm backend -rf
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Check JS Lint
          command: npm run lint

  # No `check_i18n` step: Kerghan has no i18n layer (kerghan.md §16, aux/todo.md — optional,
  # skipped for now).
  jasmine:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: rm backend -rf; cp frontend/* ./ -r; rm frontend -rf
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Tests
          command: npm run coverage

  frontend-checks:
    docker:
      - image: darthjee/circleci_node:0.2.1
    steps:
      - checkout
      - run:
          name: Set folder
          command: rm backend -rf; cp frontend/* ./ -r; rm frontend -rf
      - run:
          name: Yarn install
          command: yarn install
      - run:
          name: Check JS Lint
          command: npm run lint

  proxy_extension_tests:
    docker:
      - image: darthjee/tent-test:0.10.0
    working_directory: /home/app/app
    steps:
      - checkout:
          path: /tmp/checkout
      - run:
          name: Copy extension into place
          command: cp -r /tmp/checkout/proxy/extension/. /var/www/html/extension/
      - run:
          name: Tests
          command: vendor/bin/phpunit --bootstrap /var/www/html/extension/tests/bootstrap.php /var/www/html/extension/tests

  # Multi-arch (amd64 + arm64) publish of Kerghan's 4 base images, mirroring majora-3's
  # release-image pattern (see aux/base-image.md). Runs on tag builds only —
  # bin/image.sh's skip_if_not_tag/skip_if_unchanged decide whether to actually build/push,
  # unless FORCE_IMAGE_BUILD bypasses those guards.
  release-image:
    parameters:
      image:
        type: string
      arch:
        type: string
        default: ""
    machine: true
    steps:
      - checkout
      - run:
          name: Set up QEMU
          command: bin/image.sh qemu << parameters.image >>
      - run:
          name: Release
          command: bin/image.sh push << parameters.image >> << parameters.arch >>
