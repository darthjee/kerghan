version: 2

# Known-safe dev-only placeholder credentials, following the same pattern
# already used unflagged elsewhere in .env.dev.sample (KERGHAN_SECRET_KEY,
# KERGHAN_MYSQL_PASSWORD): non-sensitive, publicly documented in
# docs/agents/modules/auth.md, gated out of production entirely (the
# migration that consumes it no-ops when STAGE=production — see
# backend/src/database/migrations/20260824120004-auth-seed-demo-user.ts).
secret:
  ignored_matches:
    - name: Demo-user dev/manual-testing seed password (non-production only)
      match: kerghan-demo
    - name: UserUpdateService spec fixture — non-secret placeholder digest value flagged as a false-positive "Username Password" pair (issue #89, historical commit 013dc43)
      match: original-digest
    - name: Integrations dev/test placeholder key (KERGHAN_INTEGRATIONS_KEY in .env.dev.sample), rejected in production by boot validation
      match: a2VyZ2hhbi1kZXYtaW50ZWdyYXRpb25zLWtleS0zMmI=
    - name: OAuth App spec canary token (issue #302) — fake gho_ value used only in backend Jest specs to assert tokens never leak into logs/responses
      match: gho_CANARYcanaryNEW0000000000000000000n3w4
    - name: Standalone inner-MySQL overridable default password (issue #342) — the inner MySQL is never published outside the standalone container; operators override it via KERGHAN_MYSQL_PASSWORD
      match: ${KERGHAN_MYSQL_PASSWORD:-kerghan}
    - name: DefaultUserConfig spec canary password (issue #368) — fake value used only in backend Jest specs to assert the default-user password never appears in boot errors
      match: Sup3r-Secret-Pa$$
    - name: DefaultUserConfig spec too-short password fixture (issue #368) — fake value used only to exercise the minimum-length check and assert it never leaks into errors
      match: Zq9!x
    - name: Standalone client configure bats fixture password (issue #404) — fake value used only in standalone/test/configure_security.bats to assert configure makes no docker/vault calls
      match: yet-another-pw
    - name: Same configure bats fixture (issue #404), as captured with its key prefix
      match: KERGHAN_DEFAULT_USER_PASSWORD=yet-another-pw
    - name: Same configure bats fixture (issue #404), as captured up to the end of the line
      match: yet-another-pw port=3002
    - name: Standalone client wizard bats fixture password (issue #405) — fake value typed into the wizard only in standalone/test/wizard.bats
      match: wizard-typed-pw
    - name: Same wizard bats fixture (issue #405), as captured with its key prefix
      match: KERGHAN_DEFAULT_USER_PASSWORD=wizard-typed-pw
    - name: Wizard bats mismatch fixtures (issue #405) — fake values used only to exercise the typed-password mismatch re-ask
      match: first-try-pw
    - name: Same wizard bats mismatch fixture (issue #405)
      match: other-try-pw
    - name: Wizard bats generated-password assertion (issue #405) — a grep regex for 48 hex characters in standalone/test/wizard.bats, not a password
      match: "[0-9a-f]{48}$'"
    - name: Same wizard bats regex (issue #405), as captured without the closing quote
      match: "[0-9a-f]{48}$"
    - name: Same wizard bats regex (issue #405), as captured with its key prefix
      match: "KERGHAN_DEFAULT_USER_PASSWORD=[0-9a-f]{48}$"
    - name: Same wizard bats regex (issue #405), as captured up to the end of the line
      match: "[0-9a-f]{48}$' \"$ENV_FILE\""
    - name: Same wizard bats regex (issue #405), with its key prefix and closing quote
      match: "KERGHAN_DEFAULT_USER_PASSWORD=[0-9a-f]{48}$'"
    - name: Same wizard bats regex (issue #405), with its anchor and key prefix
      match: "^KERGHAN_DEFAULT_USER_PASSWORD=[0-9a-f]{48}$"
    - name: Same wizard bats regex (issue #405), with its anchor, key prefix and closing quote
      match: "^KERGHAN_DEFAULT_USER_PASSWORD=[0-9a-f]{48}$'"
    - name: Same wizard bats regex (issue #405), with its key prefix, up to the end of the line
      match: "KERGHAN_DEFAULT_USER_PASSWORD=[0-9a-f]{48}$' \"$ENV_FILE\""
    - name: Same wizard bats regex (issue #405), the character class and count only
      match: "[0-9a-f]{48}"
